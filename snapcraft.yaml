name: zordeer
base: core26
version: '10.0'
adopt-info: zordeer-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
grade: stable
confinement: strict
icon: io.github.kyuyrii.zordeer.png

apps:
  zordeer:
    command: usr/bin/zordeer
    desktop: usr/share/applications/io.github.kyuyrii.zordeer.desktop
    common-id: io.github.kyuyrii.zordeer
    environment:
      HOME: $SNAP_USER_COMMON
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      BWRAP: $SNAP/bin/bwrap
      PRESSURE_VESSEL_BWRAP: $SNAP/bin/bwrap
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe
      - umu-support

plugs:
  shared-memory:
    private: true

layout:
  /usr/share/alsa:
    symlink: $SNAP/kf6/usr/share/alsa
  /usr/lib/mangohud:
    symlink: $SNAP/usr/lib/mangohud

lint:
  ignore:
    - library:
        - usr/lib/mangohud/lib32/**

parts:
  wine-dependencies:
    plugin: nil
    stage-packages:
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-extra
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-vaapi
      - gstreamer1.0-gl
      - libgstreamer1.0-0
      - libgstreamer-gl1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer-plugins-bad1.0-0
      - libgstreamer-plugins-extra1.0-0
      - libsdl2-classic
      - libsdl2-2.0-0
      - libdecor-0-0
      - libsdl3-0

  python-packages:
    after: [wine-dependencies]
    plugin: nil
    stage-packages:
      - python3-pyqt6
      - python3-requests
      - python3-psutil
      - python3-tomlkit
    prime: [usr/lib/python3/dist-packages]

  kf6-cleanup:
    after: [python-packages]
    plugin: nil
    source: https://github.com/canonical/gpu-snap.git
    build-snaps:
    - kf6-core26
    - gtk-common-themes
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2604-cleanup mesa-2604
      set -eux
      for snap in "kf6-core26" "gtk-common-themes"; do
          cd "/snap/$snap/current" && find . -type f,l \( -name "*.so.*" -o -name "*.so" \) -exec rm -f "$CRAFT_PRIME/{}" \;
      done

  mangohud:
    after: [kf6-cleanup]
    plugin: dump
    source: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.4/MangoHud-0.8.4.r0.g992103e.tar.gz
    override-build: |
      craftctl default
      tar -xvf MangoHud-package.tar -C $CRAFT_PART_INSTALL
      sed -i 's|MANGOHUD_LIB_NAME="/usr/lib/mangohud/\\$LIB/libMangoHud_shim.so"|MANGOHUD_LIB_NAME="/usr/lib/mangohud/lib64/libMangoHud_shim.so"|' $CRAFT_PART_INSTALL/usr/bin/mangohud
    prime:
      - usr/bin
      - usr/lib/mangohud
      - usr/share

  proot-next:
    after: [mangohud]
    plugin: nil
    build-packages: [curl]
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -fsSL -o "$CRAFT_PART_INSTALL/bin/proot" \
        "https://github.com/selkies-project/proot-next/releases/download/0.3.9/proot-$(uname -m)"
      chmod +x "$CRAFT_PART_INSTALL/bin/proot"
      ln -sf proot "$CRAFT_PART_INSTALL/bin/bwrap"

  zordeer-app:
    plugin: make
    source: https://github.com/Kyuyrii/Zordeer.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info: [metainfo/io.github.kyuyrii.zordeer.metainfo.xml]
    make-parameters:
      - PREFIX=/usr
