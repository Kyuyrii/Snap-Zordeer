name: zordeer
base: core24
version: '8.1'
adopt-info: zordeer-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
grade: stable
confinement: strict
icon: io.github.kyuyrii.zordeer.png

apps:
  zordeer:
    command-chain: [define-variables, gatchnnect]
    command: usr/bin/zordeer
    desktop: usr/share/applications/io.github.kyuyrii.zordeer.desktop
    common-id: io.github.kyuyrii.zordeer
    environment:
      HOME: $SNAP_USER_COMMON
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      ZORDEER_DISABLE_UMU: "1"
      PROTON_USE_WOW64: "1"
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe

plugs:
  shared-memory:
    private: true

layout:
  /usr/lib/mangohud:
    symlink: $SNAP/usr/lib/mangohud

parts:
  zordeer-app:
    plugin: nil
    source: https://github.com/Kyuyrii/Zordeer.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info: [metainfo/io.github.kyuyrii.zordeer.metainfo.xml]
    override-pull: |
      craftctl default
      install -Dm755 zordeer $CRAFT_PART_INSTALL/usr/bin/zordeer
      install -Dm644 io.github.kyuyrii.zordeer.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.kyuyrii.zordeer.desktop
      install -Dm644 metainfo/io.github.kyuyrii.zordeer.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.kyuyrii.zordeer.metainfo.xml
      install -Dm644 translation/*.toml -t $CRAFT_PART_INSTALL/usr/share/Zordeer/translation

  base-dependencies:
    after: [zordeer-app]
    plugin: nil
    stage-packages:
      - python3-pyqt6
      - python3-requests
      - python3-psutil
      - python3-tomlkit
    prime: [usr/lib/python3/dist-packages]

  mangohud:
    after: [base-dependencies]
    plugin: dump
    source: https://github.com/flightlessmango/MangoHud/releases/download/v0.8.4/MangoHud-0.8.4.r0.g992103e.tar.gz
    override-build: |
      craftctl default
      tar -xvf MangoHud-package.tar -C $CRAFT_PART_INSTALL
      sed -i 's|MANGOHUD_LIB_NAME="/usr/lib/mangohud/\\$LIB/libMangoHud_shim.so"|MANGOHUD_LIB_NAME="/usr/lib/mangohud/lib64/libMangoHud_shim.so"|' $CRAFT_PART_INSTALL/usr/bin/mangohud
    prime:
      - usr/bin
      - usr/lib/mangohud/lib64
      - usr/share

  gatchnnect:
    after: [mangohud]
    plugin: dump
    source: https://github.com/Kyuyrii/Gatchnnect.git
    stage-snaps:
      - kdialog
    override-build: |
      craftctl default
      sed -i 's/^REQUIRED_PLUGS=.*/REQUIRED_PLUGS="joystick removable-media mount-observe bluez udisks2 system-observe hardware-observe"/' $CRAFT_PART_INSTALL/gatchnnect
      mv LICENSE $CRAFT_PART_INSTALL/LICENCE-Gatchnnect
    organize:
      LICENCE-Gatchnnect: meta/LICENCE-Gatchnnect
    prime:
      - -README.md

  other-files:
    after: [gatchnnect]
    plugin: dump
    source: ./other-files
