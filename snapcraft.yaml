name: zordeer
base: core24
version: '8.2'
adopt-info: zordeer-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
grade: stable
confinement: strict
icon: io.github.kyuyrii.zordeer.png

apps:
  zordeer:
    command-chain: [define-variables]
    command: usr/bin/zordeer
    desktop: usr/share/applications/io.github.kyuyrii.zordeer.desktop
    common-id: io.github.kyuyrii.zordeer
    environment:
      HOME: $SNAP_USER_COMMON
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      ZORDEER_DISABLE_UMU: "1"
      PROTON_USE_WOW64: "1"
      BWRAP: $SNAP/usr/bin/bwrap
      PRESSURE_VESSEL_BWRAP: $SNAP/usr/bin/bwrap
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe

plugs:
  shared-memory:
    private: true
  zordeer-runtime:
    content: zordeer-runtime
    interface: content
    target: $SNAP/zordeer-runtime
    default-provider: zordeer-runtime

layout:
  /usr/lib/mangohud:
    symlink: $SNAP/zordeer-runtime/usr/lib/mangohud

parts:
  zordeer-app:
    plugin: nil
    source: https://github.com/Kyuyrii/Zordeer.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info: [metainfo/io.github.kyuyrii.zordeer.metainfo.xml]
    override-pull: |
      craftctl default
      install -Dm755 zordeer $CRAFT_PART_INSTALL/usr/bin/zordeer
      install -Dm644 io.github.kyuyrii.zordeer.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.kyuyrii.zordeer.desktop
      install -Dm644 metainfo/io.github.kyuyrii.zordeer.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.kyuyrii.zordeer.metainfo.xml
      install -Dm644 translation/*.toml -t $CRAFT_PART_INSTALL/usr/share/Zordeer/translation

  base-dependencies:
    after: [zordeer-app]
    plugin: nil
    stage-packages:
      - python3-pyqt6
      - python3-requests
      - python3-psutil
      - python3-tomlkit
    prime: [usr/lib/python3/dist-packages]

  proot-next:
    after: [base-dependencies]
    plugin: nil
    build-packages: [curl]
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      curl -fsSL -o "$CRAFT_PART_INSTALL/usr/bin/proot" \
        "https://github.com/selkies-project/proot-next/releases/download/0.3.9/proot-$(uname -m)"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/proot"
      ln -sf proot "$CRAFT_PART_INSTALL/usr/bin/bwrap"

  other-files:
    after: [base-dependencies]
    plugin: dump
    source: ./other-files
