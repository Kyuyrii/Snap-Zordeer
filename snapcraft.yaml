name: zordeer
base: core24
version: '6.6'
adopt-info: zordeer-app
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
grade: stable
confinement: strict
icon: io.github.kyuyrii.zordeer.png

apps:
  zordeer:
    command-chain: [snap/command-chain/define-variables]
    command: usr/bin/zordeer
    desktop: usr/share/applications/io.github.kyuyrii.zordeer.desktop
    common-id: io.github.kyuyrii.zordeer
    environment:
      HOME: $SNAP_USER_COMMON
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$PYTHONPATH
      LD_LIBRARY_PATH: $SNAP/lxqt-support/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$LD_LIBRARY_PATH
      QT_PLUGIN_PATH: $SNAP/lxqt-support/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins:$QT_PLUGIN_PATH
      ZORDEER_DISABLE_UMU: "1"
    extensions: [kde-neon-6]
    plugs:
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe

plugs:
  shared-memory:
    private: true
  winehq:
    content: winehq
    interface: content
    target: $SNAP/winehq
    default-provider: wine-kyu

layout:
  /usr/lib/i386-linux-gnu/alsa-lib:
    symlink: $SNAP/winehq/usr/lib/i386-linux-gnu/alsa-lib
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    symlink: $SNAP/winehq/usr/lib/x86_64-linux-gnu/alsa-lib
  /usr/lib/mangohud:
    symlink: $SNAP/winehq/usr/lib/mangohud

parts:
  zordeer-app:
    plugin: nil
    source: https://github.com/Kyuyrii/Zordeer.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    parse-info: [metainfo/io.github.kyuyrii.zordeer.metainfo.xml]
    override-pull: |
      craftctl default
      install -Dm755 zordeer $CRAFT_PART_INSTALL/usr/bin/zordeer
      install -Dm644 io.github.kyuyrii.zordeer.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.kyuyrii.zordeer.desktop
      install -Dm644 metainfo/io.github.kyuyrii.zordeer.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.kyuyrii.zordeer.metainfo.xml
      install -Dm644 translation/*.toml -t $CRAFT_PART_INSTALL/usr/share/Zordeer/translation

  base-dependencies:
    plugin: nil
    stage-packages:
      - python3-pyqt6
      - python3-requests
      - python3-psutil
      - python3-tomlkit
    prime:
      - usr/lib/python3/dist-packages

  other-files:
    after: [base-dependencies]
    plugin: dump
    source: ./other-files
    organize:
      define-variables: snap/command-chain/define-variables